<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPMincho:wght@400;700&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="/src/style.css" />
		<script type="module" src="/src/js/pages/register.js"></script>

		<title>Register - Akky</title>
	</head>
	<body>
		<header>
			<a href="/index.html"> <img src="/public/icons.svg" alt="akky" /> </a>
			<a href="/auth/login/" id="login-link">Log in</a>
			<a href="#" id="logout-link">Log out</a>
			<a href="/listing/create/index.html">Create Listing</a>
			<a href="/auth/register/index.html">Register</a>
			<span id="header-credits"></span>
		</header>
		<main>
			<h1>Register</h1>
			<form id="register-form">
				<label for="name">Name:</label>
				<input type="text" id="name" name="name" placeholder="Enter your name" autocomplete="username" required />
				<label for="email">Email:</label>
				<input type="email" id="email" name="email" placeholder="you@stud.noroff.no" autocomplete="email" required />
				<label for="password">Password:</label>
				<input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required />
				<p id="form-message" aria-live="polite"></p>
				<button type="submit">Register</button>
			</form>
			<p>Already have an account? <a href="/auth/login/">Log in</a></p>
		</main>
		<footer>
			<p>&copy; 2026 Akky. All rights reserved.</p>
		</footer>
	</body>
</html>
