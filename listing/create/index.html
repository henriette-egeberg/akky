<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPMincho:wght@400;700&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="/src/style.css" />
		<script type="module" src="/src/js/pages/create.js"></script>

		<title>Listing - Akky</title>
	</head>
	<body>
		<header>
			<a href="/index.html"> <img src="/public/icons.svg" alt="akky" /> </a>
			<a href="/auth/login/" id="login-link">Log in</a>
			<a href="#" id="logout-link">Log out</a>
			<a href="/listing/create/index.html">Create Listing</a>
			<a href="/auth/register/index.html">Register</a>
			<span id="header-credits"></span>
		</header>
		<main id="app_login">
			<h1>Create listing</h1>
			<form id="create-form">
				<label for="title">Title:</label>
				<input type="text" id="title" name="title" required />

				<label for="description">Description:</label>
				<textarea id="description" name="description"></textarea>

				<label for="endsAt">Deadline:</label>
				<input type="datetime-local" id="endsAt" name="endsAt" required />

				<label for="image">Image URL:</label>
				<input type="url" id="image" name="image" />

				<p id="form-message" aria-live="polite"></p>
				<button type="submit">Create</button>
			</form>
		</main>
		<footer>
			<p>&copy; 2026 Akky. All rights reserved.</p>
		</footer>
	</body>
</html>
