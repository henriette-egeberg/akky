<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPMincho:wght@400;700&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="/src/style.css" />
		<script type="module" src="/src/js/pages/login.js"></script>

		<title>Login - Akky</title>
	</head>
	<body class="bg-gray-100 text-gray-900 min-h-10vh">
		<header class="flex justify-between items-center p-4 bg-gray-800 text-white">
			<a href="/index.html"> <img src="/public/favicon.svg" alt="akky" class="h-10 w-10" /> </a>
			<a href="/auth/login/" id="login-link">Log in</a>
			<a href="#" id="logout-link">Log out</a>
			<a href="/listing/create/index.html" id="create-link">Create Listing</a>
			<a href="/auth/register/index.html" id="register-link">Register</a>
			<span id="header-credits"></span>
		</header>
		<main id="app_login" class="main-content m-4">
			<h1 class="text-4xl font-bold">Login</h1>
			<form id="login-form">
				<label for="email">Email:</label>
				<input
					class="max-w-100 block w-full border border-gray-300 focus:ring-blue-500 focus:border-blue-500 sm:text-sm border-gray-300 h-6 mt-2 mb-2"
					type="email"
					id="email"
					name="email"
					placeholder="Enter your email"
					autocomplete="email"
					required
				/>

				<label for="password">Password:</label>
				<input
					class="max-w-100 block w-full border border-gray-300 focus:ring-blue-500 focus:border-blue-500 sm:text-sm border-gray-300 h-6 mt-2 mb-2"
					type="password"
					id="password"
					name="password"
					placeholder="Enter your password"
					autocomplete="current-password"
					required
				/>

				<p id="form-message" aria-live="polite"></p>
				<button class="bg-gray-600 hover:bg-gray-800 text-white px-4 rounded mb-4" type="submit">Login</button>
			</form>
			<p class="text-sm text-blue-600 underline">Need an account? <a href="/auth/register/index.html">Register</a></p>
		</main>
		<footer>
			<p>&copy; 2026 Akky. All rights reserved.</p>
		</footer>
	</body>
</html>
