<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPMincho:wght@400;700&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="/src/style.css" />
		<script type="module" src="/src/js/pages/create.js"></script>

		<title>Listing - Akky</title>
	</head>
	<body class="bg-gray-100 text-gray-900 min-h-10vh">
		<header class="flex justify-between items-center p-4 bg-gray-800 text-white">
			<a href="/index.html"> <img src="/public/favicon.svg" alt="akky" class="h-10 w-10" /> </a>
			<a href="/auth/login/" id="login-link">Log in</a>
			<a href="#" id="logout-link">Log out</a>
			<a href="/listing/create/index.html" id="create-link">Create Listing</a>
			<a href="/auth/register/index.html" id="register-link">Register</a>
			<span id="header-credits"></span>
		</header>
		<main id="app_login" class="main-content m-4">
			<h1 class="text-4xl font-bold">Create listing</h1>
			<form id="create-form">
				<label for="title">Title:</label>
				<input class="max-w-100 block w-full border border-gray-300 focus:ring-blue-500 focus:border-blue-500 sm:text-sm border-gray-300 h-6 mt-2 mb-2" type="text" id="title" name="title" required />

				<label for="description">Description:</label>
				<textarea id="description" name="description"></textarea>

				<label for="endsAt">Deadline:</label>
				<input
					class="max-w-100 block w-full border border-gray-300 focus:ring-blue-500 focus:border-blue-500 sm:text-sm border-gray-300 h-6 mt-2 mb-2"
					type="datetime-local"
					id="endsAt"
					name="endsAt"
					required
				/>

				<label for="image">Image URL:</label>
				<input class="max-w-100 block w-full border border-gray-300 focus:ring-blue-500 focus:border-blue-500 sm:text-sm border-gray-300 h-6 mt-2 mb-2" type="url" id="image" name="image" />

				<p id="form-message" aria-live="polite"></p>
				<button class="bg-gray-600 hover:bg-gray-800 text-white px-4 rounded mb-4" type="submit">Create</button>
			</form>
		</main>
		<footer>
			<p>&copy; 2026 Akky. All rights reserved.</p>
		</footer>
	</body>
</html>
