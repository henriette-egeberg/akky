<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPMincho:wght@400;700&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="/src/style.css" />
		<script type="module" src="/src/js/pages/login.js"></script>

		<title>Login - Akky</title>
	</head>
	<body>
		<header>
			<a href="/index.html"> <img src="/public/icons.svg" alt="akky" /> </a>
			<a href="#" id="logout-link">Log out</a>
			<a href="/auth/register/index.html">Register</a>
		</header>
		<main id="app_login">
			<h1>Login</h1>
			<form id="login-form">
				<label for="email">Email:</label>
				<input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required />

				<label for="password">Password:</label>
				<input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required />

				<p id="form-message" aria-live="polite"></p>
				<button type="submit">Login</button>
			</form>
			<p>Need an account? <a href="/auth/register/index.html">Register</a></p>
		</main>
		<footer>
			<p>&copy; 2026 Akky. All rights reserved.</p>
		</footer>
	</body>
</html>
